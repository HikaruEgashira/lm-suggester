name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: [self-hosted, linux, arm64, hikae-flash]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        timeout-minutes: 5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        timeout-minutes: 5
        with:
          go-version-file: 'go.mod'
          # Disable the GitHub-hosted cache: the self-hosted runner's cache
          # service answers HTTP 400, which surfaces as transient
          # "Failed to restore/save: Cache service responded with 400"
          # warnings.
          cache: false

      - name: Run tests
        run: go test -v -race ./...
        timeout-minutes: 10

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de  # v7.3.0
        timeout-minutes: 30
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}