name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: [self-hosted, linux, arm64, hikae-flash]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        timeout-minutes: 5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        timeout-minutes: 5
        with:
          go-version-file: 'go.mod'
          # Disable the GitHub-hosted cache to avoid transient
          # "Failed to save" warnings on self-hosted runners.
          cache: false

      - name: Run tests
        run: go test -v -race ./...
        timeout-minutes: 10

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@9ed2f89a662bf1735a48bc8557fd212fa902bebf  # v6.1.0
        timeout-minutes: 30
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}