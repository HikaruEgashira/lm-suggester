name: SBOM Generation and Submission

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run weekly on Monday at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sbom:
    runs-on: [self-hosted, linux, arm64, hikae-flash]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        timeout-minutes: 5

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        timeout-minutes: 5
        with:
          go-version: '1.25'
          # Disable the GitHub-hosted cache: the self-hosted runner's cache
          # service answers HTTP 400, which surfaces as transient
          # "Failed to restore/save: Cache service responded with 400"
          # warnings.
          cache: false

      - name: Install syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
        timeout-minutes: 3

      - name: Generate SBOM (SPDX JSON)
        run: |
          syft dir:. -o spdx-json=sbom.spdx.json
        timeout-minutes: 5

      - name: Generate SBOM (CycloneDX JSON)
        run: |
          syft dir:. -o cyclonedx-json=sbom.cyclonedx.json
        timeout-minutes: 5

      - name: Generate dependency snapshot
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          syft dir:. -o github-json=sbom.github.json
        timeout-minutes: 5

      - name: Submit SBOM to Dependency Graph
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sSfL -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            --data-binary @sbom.github.json \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/dependency-graph/snapshots"
        timeout-minutes: 3

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sbom-files
          path: |
            sbom.spdx.json
            sbom.cyclonedx.json
          retention-days: 90
        timeout-minutes: 2
